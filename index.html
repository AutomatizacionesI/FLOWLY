<!doctype html>
<html lang="es-UY">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Spike AI construye sistemas a medida y automatizaciones para empresas que necesitan ordenar su operación. Desde Montevideo, Uruguay. Diagnóstico sin costo."
    />
    <link rel="icon" type="image/png" sizes="512x512" href="/spike-favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/brand/spike-mark.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/spike-apple-touch-icon.png" />
    <link rel="canonical" href="https://spikeai.com.uy/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_UY" />
    <meta property="og:site_name" content="Spike AI" />
    <meta property="og:title" content="Spike AI - Tu operación en un solo lugar" />
    <meta
      property="og:description"
      content="Sistemas a medida y automatización para empresas que necesitan ordenar su operación."
    />
    <meta property="og:url" content="https://spikeai.com.uy/" />
    <meta property="og:image" content="https://spikeai.com.uy/brand/og-spike.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Spike AI: sistemas a medida, automatización e IA para empresas. Montevideo, Uruguay." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Spike AI - Tu operación en un solo lugar" />
    <meta
      name="twitter:description"
      content="Sistemas a medida y automatización para empresas que necesitan ordenar su operación."
    />
    <meta name="twitter:image" content="https://spikeai.com.uy/brand/og-spike.png" />
    <noscript>
      <style>
        /* Sin JS no corren las animaciones de entrada: todo visible. */
        [data-blur-fade] { opacity: 1 !important; filter: none !important; transform: none !important; }
      </style>
    </noscript>
    <!--estilos-landing-->
    <script>
      /* El panel y la demo no usan el HTML prerenderizado de la landing ni sus
         estilos: se sacan los estilos, el HTML se oculta mientras se descarga y
         se borra apenas termina (script después de #root). */
      if (/^\/(admin|democontable)(\/|$)/.test(location.pathname)) {
        document.documentElement.classList.add("sin-landing")
        document.querySelectorAll("[data-landing]").forEach((el) => el.remove())
      }
    </script>
    <style>
      .sin-landing #root { visibility: hidden; }
    </style>
    <title>Spike AI - Sistemas a medida y automatización para empresas</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      /* El panel y la demo no usan el HTML prerenderizado de la landing. */
      if (document.documentElement.classList.contains("sin-landing")) {
        document.getElementById("root").replaceChildren()
        document.documentElement.classList.remove("sin-landing")
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
