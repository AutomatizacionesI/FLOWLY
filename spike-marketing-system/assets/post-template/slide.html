<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="shared.css">
  <title>{{ID}} · {{NUMBER}}</title>
</head>
<body>
  <main class="slide">
    <div class="signal"></div>
    <section>
      <p class="eyebrow">{{EYEBROW}}</p>
      <h1 class="headline">{{TITLE}}</h1>
      <p class="support">Editar este texto según el borrador editorial aprobado.</p>
    </section>
    <footer class="footer">
      <span class="wordmark">Spike AI</span>
      <span class="page">{{NUMBER}} / {{TOTAL}}</span>
    </footer>
  </main>
</body>
</html>
